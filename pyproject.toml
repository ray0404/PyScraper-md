[project]
name = "scraper"
version = "0.1.0"
description = ""
authors = [
    {name = "ray0404",email = "ray.valentin.04@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "markdownify (>=1.2.2,<2.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "click (>=8.3.1,<9.0.0)",
    "flask (>=3.1.2,<4.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)"
]

[project.optional-dependencies]
dynamic = [
    "playwright (>=1.49.1,<2.0.0)"
]

[tool.poetry]
packages = [
    { include = "md_scraper", from = "src" },
]

# Bundle the TypeScript engine in the wheel so engine="ts" works from a
# wheel install (see md_scraper.ts_engine). Sources are always bundled;
# dist/ only when built first (scripts/build-wheel.sh runs `npm run build`
# in typescript/). Verified 2026-11-16 against poetry-core 2.x:
# - `packages` entries cannot carry this tree: they require a `to` key
#   (not `target`) AND the directory to contain a .py file
#   ("X is not a package" otherwise).
# - `include` entries have no target, so the tree lands at the wheel root
#   (installed as site-packages/typescript/ next to md_scraper/).
# - Explicit `include` entries are subtracted from the VCS-ignored set,
#   so gitignored dist/ survives; node_modules/ is never listed here.
# - Plain string includes default to sdist-only in poetry-core
#   (Factory._prepare_formats default_formats=["sdist"]), so the format
#   must be spelled out or the wheel gets nothing.
include = [
    { path = "typescript/src", format = ["sdist", "wheel"] },
    { path = "typescript/dist", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
scraper = "md_scraper.cli:cli"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
pytest-flask = "^1.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
